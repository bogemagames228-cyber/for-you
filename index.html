<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>КИСИК, ПРОСТИ МЕНЯ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    font-family: 'Georgia', serif;
    background: linear-gradient(160deg, #ffe0ec 0%, #ffc2d6 50%, #ffb3c9 100%);
    min-height: 100vh;
    color: #6b2d4a;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 22px;
    text-align: center;
    transition: opacity 0.9s ease, transform 0.9s ease;
    overflow-y: auto;
  }
  .screen.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.05);
  }

  /* ---------- ЗАСТАВКА ---------- */
  #intro .envelope {
    font-size: 90px;
    animation: pulse 2s ease-in-out infinite;
    margin-bottom: 25px;
    filter: drop-shadow(0 10px 20px rgba(255,107,157,0.5));
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1) rotate(-3deg); }
    50% { transform: scale(1.15) rotate(3deg); }
  }
  #intro h1 {
    font-size: 1.6rem;
    margin-bottom: 12px;
    color: #8a2b52;
    opacity: 0;
    animation: fadeIn 1.8s 0.3s forwards;
  }
  #intro p {
    font-size: 1rem;
    color: #a04a6b;
    margin-bottom: 35px;
    opacity: 0;
    animation: fadeIn 1.8s 0.9s forwards;
  }

  /* ---------- КНОПКИ ---------- */
  .btn {
    display: inline-block;
    padding: 16px 42px;
    font-size: 1.05rem;
    font-family: inherit;
    background: linear-gradient(135deg, #ff6b9d, #ff3d77);
    color: #fff;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255,61,119,0.45);
    transition: transform 0.25s, box-shadow 0.25s;
    opacity: 0;
    animation: fadeIn 1.8s 1.5s forwards;
    letter-spacing: 1px;
  }
  .btn:active {
    transform: scale(0.95);
    box-shadow: 0 5px 15px rgba(255,61,119,0.6);
  }

  /* ---------- ЭКРАН ПИСЬМА ---------- */
  #letter h2 {
    font-size: 1.5rem;
    margin-bottom: 10px;
    color: #8a2b52;
    letter-spacing: 2px;
    font-weight: bold;
  }
  #letter .subtitle {
    font-size: 0.85rem;
    color: #a04a6b;
    letter-spacing: 2px;
    margin-bottom: 25px;
    text-transform: uppercase;
  }
  .typing {
    font-size: 1rem;
    line-height: 1.9;
    max-width: 500px;
    min-height: 200px;
    color: #7a3350;
    text-align: left;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    background: #ff3d77;
    animation: blink 0.7s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- ЭКРАН "ЧТО БУДЕМ ДЕЛАТЬ?" ---------- */
  #action h2 {
    font-size: 1.6rem;
    margin-bottom: 20px;
    color: #8a2b52;
    letter-spacing: 2px;
  }
  .step-label {
    font-size: 0.9rem;
    color: #a04a6b;
    margin-bottom: 20px;
    font-style: italic;
    min-height: 20px;
  }
  .action-option {
    display: block;
    width: 100%;
    max-width: 380px;
    padding: 18px 25px;
    margin: 12px auto;
    font-size: 1.05rem;
    font-family: inherit;
    background: #fff;
    color: #8a2b52;
    border: 2px solid #ffb3c9;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(255,107,157,0.15);
  }

  /* ---------- КАЛЕНДАРЬ ---------- */
  #date h2 {
    font-size: 1.6rem;
    margin-bottom: 15px;
    color: #8a2b52;
    letter-spacing: 2px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 400px;
    width: 100%;
    margin: 0 auto;
  }
  .date-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 2px solid #ffb3c9;
    border-radius: 15px;
    cursor: pointer;
    transition: all 0.3s;
    padding: 5px;
  }
  .date-cell .day-num {
    font-size: 1.4rem;
    font-weight: bold;
    color: #8a2b52;
  }
  .date-cell .day-name {
    font-size: 0.7rem;
    color: #a04a6b;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ---------- ВРЕМЯ ---------- */
  #time h2 {
    font-size: 1.6rem;
    margin-bottom: 15px;
    color: #8a2b52;
    letter-spacing: 2px;
  }
  .time-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-width: 400px;
    width: 100%;
    margin: 0 auto;
  }
  .time-cell {
    padding: 14px 5px;
    background: #fff;
    border: 2px solid #ffb3c9;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    color: #8a2b52;
    cursor: pointer;
    transition: all 0.3s;
  }

  /* ---------- ФИНАЛЬНЫЙ ЭКРАН ---------- */
  #thanks h2 {
    font-size: 1.5rem;
    margin-bottom: 15px;
    color: #8a2b52;
    line-height: 1.5;
    letter-spacing: 1px;
  }
  #thanks .chosen-info {
    font-size: 1.05rem;
    color: #7a3350;
    margin-bottom: 25px;
    line-height: 1.7;
  }
  .date-box {
    display: inline-block;
    padding: 20px 35px;
    margin: 20px auto;
    background: #fff;
    border: 3px solid #ff6b9d;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(255,107,157,0.35);
    position: relative;
  }
  .date-box::before {
    content: '💗';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffe0ec;
    padding: 0 10px;
    font-size: 1.5rem;
  }
  .date-box .date-big {
    font-size: 1.4rem;
    font-weight: bold;
    color: #ff3d77;
    letter-spacing: 2px;
  }
  .date-box .time-big {
    font-size: 1.1rem;
    color: #8a2b52;
    margin-top: 8px;
    letter-spacing: 1px;
  }
  .photo-frame {
    margin: 30px auto 10px;
    max-width: 320px;
    width: 100%;
    padding: 12px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(255,61,119,0.3);
    transform: rotate(-2deg);
    opacity: 0;
    animation: fadeInPhoto 2s 1s forwards;
  }
  .photo-frame img {
    width: 100%;
    display: block;
    border-radius: 12px;
  }
  @keyframes fadeInPhoto {
    from { opacity: 0; transform: rotate(-2deg) translateY(20px); }
    to { opacity: 1; transform: rotate(-2deg) translateY(0); }
  }
  .love-note {
    margin-top: 25px;
    font-size: 1.1rem;
    color: #8a2b52;
    letter-spacing: 1px;
    font-style: italic;
    opacity: 0;
    animation: fadeIn 2s 2s forwards;
  }

  /* ---------- ЭКРАН "ЛЮБИМАЯ" МИЛЛИОН РАЗ ---------- */
  #million {
    padding: 40px 15px;
    justify-content: flex-start;
  }
  #million .million-wall {
    font-size: 8px;
    line-height: 1.1;
    word-wrap: break-word;
    word-break: break-word;
    color: #ff3d77;
    text-align: justify;
    max-width: 100%;
    margin: 20px auto;
    font-weight: bold;
    letter-spacing: 0.5px;
    opacity: 0.9;
    user-select: none;
  }
  #million .million-sign {
    display: inline-block;
    margin: 30px auto 20px;
    padding: 18px 25px;
    background: #fff;
    border: 3px solid #ff6b9d;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(255,107,157,0.35);
    font-size: 1rem;
    color: #8a2b52;
    font-style: italic;
    line-height: 1.5;
    max-width: 340px;
    position: relative;
  }
  #million .million-sign::before {
    content: '💗';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffe0ec;
    padding: 0 10px;
    font-size: 1.5rem;
  }

  /* ---------- СЕРДЕЧКИ ---------- */
  .heart-float {
    position: fixed;
    font-size: 1.3rem;
    animation: floatUp linear infinite;
    pointer-events: none;
    opacity: 0.7;
    z-index: 1;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    10% { opacity: 0.85; }
    90% { opacity: 0.85; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

<!-- ========== ЭКРАН 1: ЗАСТАВКА ========== -->
<div class="screen" id="intro">
  <div class="envelope">💌</div>
  <h1>У меня есть кое-что важное<br>сказать тебе...</h1>
  <p>Нажми на кнопку ниже 💗</p>
  <button class="btn" onclick="goTo('letter')">Открыть</button>
</div>

<!-- ========== ЭКРАН 2: ПИСЬМО ========== -->
<div class="screen hidden" id="letter">
  <h2>КИСИК, ПРОСТИ МЕНЯ</h2>
  <div class="subtitle">Я ДОЛГО СОБИРАЛАСЬ ЭТО НАПИСАТЬ</div>
  <p class="typing" id="typingText"></p>
  <button class="btn" id="letterNextBtn" style="opacity:0; display:none;" onclick="goTo('action')">Дальше →</button>
</div>

<!-- ========== ЭКРАН 3: ЧТО БУДЕМ ДЕЛАТЬ? ========== -->
<div class="screen hidden" id="action">
  <h2>ЧТО БУДЕМ ДЕЛАТЬ?</h2>
  <button class="action-option" onclick="chooseAction('Выслушаю тебя 💗', this)">1) Выслушаю тебя (всё в живую)</button>
  <button class="action-option" onclick="chooseAction('Давай встретимся 💗', this)">2) Давай встретимся</button>
  <button class="action-option" onclick="chooseAction('Дай мне время 💗', this)">3) Дай мне время</button>
  <button class="action-option" onclick="chooseAction('Позвони мне 💗', this)">4) Позвони мне</button>
</div>

<!-- ========== ЭКРАН 4: КОГДА? ========== -->
<div class="screen hidden" id="date">
  <h2>КОГДА?</h2>
  <p class="step-label" id="chosenActionLabel"></p>
  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- ========== ЭКРАН 5: ВО СКОЛЬКО? ========== -->
<div class="screen hidden" id="time">
  <h2>ВО СКОЛЬКО?</h2>
  <p class="step-label" id="chosenDateLabel"></p>
  <div class="time-grid" id="timeGrid"></div>
</div>

<!-- ========== ЭКРАН 6: СПАСИБО ========== -->
<div class="screen hidden" id="thanks">
  <h2>Спасибо, что выбрала 💗</h2>
  <p class="chosen-info" id="chosenInfo"></p>
  <div class="date-box">
    <div class="date-big" id="dateBig"></div>
    <div class="time-big" id="timeBig"></div>
  </div>
  <div class="photo-frame">
    <img src="https://i.ibb.co/p6PhV3qC/IMG-1181.jpg" alt="Мы">
  </div>
  <p class="love-note">Я тебя безумно люблю 💕</p>
  <button class="btn" style="opacity:1; animation:none; margin-top:30px;" onclick="goTo('million')">Ещё кое-что →</button>
</div>

<!-- ========== ЭКРАН 7: ЛЮБИМАЯ МИЛЛИОН РАЗ ========== -->
<div class="screen hidden" id="million">
  <div class="million-wall" id="millionWall"></div>
  <div class="million-sign">
    Я написала твоё имя миллион раз.<br>Каждый раз — прости.
  </div>
</div>

<script>
  // ---------- ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ ----------
  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    if (id === 'letter') startTyping();
    if (id === 'million') buildMillionWall();
    window.scrollTo(0, 0);
  }

  // ---------- ПЕЧАТАЮЩИЙСЯ ТЕКСТ ПИСЬМА ----------
  const fullText = "Я была не права. Не в мелочи, а в том, как с тобой обошлась. И поняла это не сразу, а когда стало поздно.\n\nРаньше мне казалось: промолчу и всё само уляжется. Не улеглось. Я оставляю тебя одну с тем, что натворила, и сделала тебе больно ещё раз.\n\nОправдываться не буду, мне нечем. Хочу только, чтобы ты знала: я всё поняла, и мне правда жаль.\n\nЯ тебя безумно люблю 💗";
  let charIndex = 0;
  let typingStarted = false;

  function startTyping() {
    if (typingStarted) return;
    typingStarted = true;
    const el = document.getElementById('typingText');
    const btn = document.getElementById('letterNextBtn');
    
    function type() {
      if (charIndex < fullText.length) {
        el.innerHTML = fullText.slice(0, charIndex + 1).replace(/\n/g, '<br>') + '<span class="cursor">&nbsp;</span>';
        charIndex++;
        setTimeout(type, 45);
      } else {
        el.innerHTML = fullText.replace(/\n/g, '<br>');
        btn.style.display = 'inline-block';
        btn.style.animation = 'fadeIn 1s forwards';
      }
    }
    type();
  }

  // ---------- ВЫБОР ДЕЙСТВИЯ (С ПОДСВЕТКОЙ) ----------
  let chosenAction = '';
  let chosenDate = '';
  let chosenTime = '';

  function chooseAction(action, btn) {
    document.querySelectorAll('.action-option').forEach(b => {
      b.style.background = '#fff';
      b.style.color = '#8a2b52';
      b.style.border = '2px solid #ffb3c9';
      b.style.transform = 'scale(1)';
    });
    btn.style.background = '#ff6b9d';
    btn.style.color = '#fff';
    btn.style.border = '2px solid #ff3d77';
    btn.style.transform = 'scale(1.05)';

    chosenAction = action;
    document.getElementById('chosenActionLabel').textContent = '✔ Ты выбрала: ' + action;

    setTimeout(() => goTo('date'), 700);
  }

  // ---------- КАЛЕНДАРЬ (14 сентября — 1 октября) ----------
  const dayNames = ['вс','пн','вт','ср','чт','пт','сб'];
  const monthNames = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

  function buildCalendar() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    
    const start = new Date(2025, 8, 14);
    const end = new Date(2025, 9, 1);
    
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const day = d.getDate();
      const monthShort = monthNames[d.getMonth()];
      const dayName = dayNames[d.getDay()];
      
      const cell = document.createElement('button');
      cell.className = 'date-cell';
      cell.innerHTML = `<div class="day-num">${day}</div><div class="day-name">${monthShort}, ${dayName}</div>`;
      cell.onclick = () => {
        document.querySelectorAll('.date-cell').forEach(c => {
          c.style.background = '#fff';
          c.style.border = '2px solid #ffb3c9';
          c.querySelector('.day-num').style.color = '#8a2b52';
          c.querySelector('.day-name').style.color = '#a04a6b';
        });
        cell.style.background = '#ff6b9d';
        cell.style.border = '2px solid #ff3d77';
        cell.querySelector('.day-num').style.color = '#fff';
        cell.querySelector('.day-name').style.color = '#fff';

        chosenDate = `${day} ${monthShort}`;
        document.getElementById('chosenDateLabel').textContent = '✔ ' + chosenAction + ' — ' + chosenDate;

        setTimeout(() => goTo('time'), 700);
      };
      grid.appendChild(cell);
    }
  }
  buildCalendar();

  // ---------- ВРЕМЯ (0:00 — 23:00) ----------
  function buildTime() {
    const grid = document.getElementById('timeGrid');
    grid.innerHTML = '';
    for (let h = 0; h < 24; h++) {
      const cell = document.createElement('button');
      cell.className = 'time-cell';
      cell.textContent = h + ':00';
      cell.onclick = () => {
        document.querySelectorAll('.time-cell').forEach(c => {
          c.style.background = '#fff';
          c.style.color = '#8a2b52';
          c.style.border = '2px solid #ffb3c9';
        });
        cell.style.background = '#ff6b9d';
        cell.style.color = '#fff';
        cell.style.border = '2px solid #ff3d77';

        chosenTime = h + ':00';
        setTimeout(showThanks, 700);
      };
      grid.appendChild(cell);
    }
  }
  buildTime();

  // ---------- ФИНАЛЬНЫЙ ЭКРАН ----------
  function showThanks() {
    goTo('thanks');
    document.getElementById('chosenInfo').innerHTML = `Ты выбрала:<br><b>${chosenAction}</b>`;
    document.getElementById('dateBig').textContent = chosenDate;
    document.getElementById('timeBig').textContent = 'в ' + chosenTime;
    for (let i = 0; i < 30; i++) setTimeout(createHeart, i * 80);
  }

  // ---------- ЭКРАН "ЛЮБИМАЯ" МИЛЛИОН РАЗ ----------
  let millionBuilt = false;
  function buildMillionWall() {
    if (millionBuilt) return;
    millionBuilt = true;
    const wall = document.getElementById('millionWall');
    const word = 'ЛЮБИМАЯ ';
    let count = 0;
    const chunk = 5000;
    const total = 125000;
    
    function addChunk() {
      let str = '';
      const end = Math.min(count + chunk, total);
      for (let i = count; i < end; i++) str += word;
      wall.innerHTML += str;
      count = end;
      if (count < total) setTimeout(addChunk, 5);
    }
    addChunk();
  }

  // ---------- ПАДАЮЩИЕ СЕРДЕЧКИ ----------
  const emojis = ['💗','💖','💕','🌸','✨','💞'];
  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart-float';
    heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (5 + Math.random() * 5) + 's';
    heart.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 11000);
  }
  
  setInterval(createHeart, 900);
  for (let i = 0; i < 5; i++) setTimeout(createHeart, i * 300);
</script>

</body>
</html>
